[project]
name = "zurashitabi-backend"
version = "0.0.0"
description = "Dependency environment; application implementation is not included."
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2,<3",
  "pydantic-settings",
  "httpx",
  "firebase-admin",
  "google-cloud-firestore",
  "google-genai",
  "tzdata",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
